<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de abastecimiento de por vida</title>
  </head>
  <body>
    <main>
      <h1>🍿 Calculadora de abastecimiento de por vida</h1>

      <section aria-labelledby="snacks-title">
        <h2 id="snacks-title">🍟 Ejercicio 1: El cálculo de los snacks</h2>
        <p>Calculá cuántos snacks vas a comer y cuánto gastarías durante el resto de tu vida.</p>
        <button id="calculate-snacks" type="button">Calcular snacks</button>
        <p id="snacks-result" aria-live="polite"></p>
      </section>

      <section aria-labelledby="travel-title">
        <h2 id="travel-title">✈️ Ejercicio 2: Presupuesto de viaje</h2>
        <p>Calculá cuánto podés gastar en cada comida durante tus vacaciones.</p>
        <button id="calculate-travel" type="button">Calcular presupuesto</button>
        <p id="travel-result" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
